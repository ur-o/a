<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Open Social Accounts directly into App</title>
<meta name="description" content="Open YouTube, Instagram or Facebook Accounts directly in the app.">

<meta property="og:type" content="website">
<meta property="og:title" content="Open Social Accounts directly into App">
<meta property="og:description" content="Tap to open Accounts directly in YouTube, Instagram or Facebook.">

<meta name="twitter:title" content="Open Social Accounts directly into App">
<meta name="twitter:description" content="Tap to open Accounts directly in YouTube, Instagram or Facebook.">

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    min-height:100%;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at 10% 10%,rgba(255,0,100,.18),transparent 30%),
        radial-gradient(circle at 90% 20%,rgba(0,140,255,.18),transparent 30%),
        linear-gradient(135deg,#080b14,#111827 55%,#080b14);
    color:#fff;
    min-height:100vh;
}

.container{
    width:min(680px,92%);
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:20px 0;
}

.card{
    background:rgba(17,24,39,.82);
    border:1px solid rgba(255,255,255,.09);
    border-radius:22px;
    padding:28px 22px;
    box-shadow:0 20px 60px rgba(0,0,0,.3);
    backdrop-filter:blur(14px);
    text-align:center;
}

.rocket{
    font-size:72px;
    margin-bottom:8px;
    animation:rocket 1.6s ease-in-out infinite;
}

@keyframes rocket{
    0%,100%{
        transform:translateY(0) rotate(-3deg);
    }

    50%{
        transform:translateY(-10px) rotate(3deg);
    }
}

h2{
    margin:5px 0 8px;
    font-size:25px;
}

.subtitle{
    color:#9ca8ba;
    margin:0 0 22px;
    line-height:1.5;
}

.platform{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    font-size:17px;
    font-weight:800;
    margin-bottom:20px;
}

.platform-icon{
    width:38px;
    height:38px;
    border-radius:11px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
}

.youtube{
    background:#ff0033;
}

.instagram{
    background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045);
}

.facebook{
    background:#1877f2;
}

.retry{
    width:100%;
    border:0;
    border-radius:14px;
    padding:15px;
    color:#fff;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    box-shadow:0 10px 25px rgba(0,0,0,.18);
}

.retry:active{
    transform:scale(.99);
}

.youtube-btn{
    background:#ff0033;
}

.instagram-btn{
    background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045);
}

.facebook-btn{
    background:#1877f2;
}

.brand-logo{
    width:22px;
    height:22px;
    flex:0 0 22px;
    display:block;
}

.failure{
    display:none;
    margin-top:18px;
    color:#fca5a5;
    font-size:14px;
}

.credit{
    text-align:center;
    color:#64748b;
    font-size:12px;
    margin-top:24px;
}

.error{
    text-align:center;
}

.error-icon{
    font-size:70px;
}

.error h2{
    margin:12px 0;
}

.error p{
    margin:6px 0;
    color:#9ca8ba;
}

@media(max-width:520px){

    .container{
        width:92%;
    }

    .card{
        padding:24px 17px;
    }

    h2{
        font-size:23px;
    }
}
</style>

<script>
const q=new URLSearchParams(location.search);
const ua=navigator.userAgent;

const mobile=/Android|iPhone|iPad|iPod/i.test(ua);

let app="",web="",u="",platform="";

if(q.has("y")){

    u=q.get("y").replace(/^@/,"");

    platform="youtube";

    app=`intent://www.youtube.com/@${encodeURIComponent(u)}#Intent;scheme=https;package=com.google.android.youtube;end`;

    web=`https://www.youtube.com/@${encodeURIComponent(u)}`;

}
else if(q.has("i")){

    u=q.get("i").replace(/^@/,"");

    platform="instagram";

    app=`instagram://user?username=${encodeURIComponent(u)}`;

    web=`https://www.instagram.com/${encodeURIComponent(u)}/`;

}
else if(q.has("f")){

    u=q.get("f").replace(/^@/,"");

    platform="facebook";

    app=`fb://facewebmodal/f?href=https://facebook.com/${encodeURIComponent(u)}`;

    web=`https://www.facebook.com/${encodeURIComponent(u)}`;

}

function openApp(){

    if(app){
        location.href=app;
    }

}

/* Desktop: same original behavior */
if(app && !mobile){
    location.replace(web);
}
</script>

</head>

<body>

<script>

if(!app){

document.body.innerHTML=`

<div class="container">

    <div class="card error">

        <div class="error-icon">😕</div>

        <h2>Invalid Link</h2>

        <p>Missing parameter.</p>

        <p>Please check the URL and try again.</p>

    </div>

    <div class="credit">
        Created with ❤️ by <strong>Amit Yadav</strong>
    </div>

</div>

`;

}

else if(mobile){

let icon="";
let name="";
let buttonClass="";
let logo="";

if(platform==="youtube"){

    name="YouTube";
    icon="▶";
    buttonClass="youtube-btn";

    logo=`
    <svg class="brand-logo" viewBox="0 0 24 24">
        <path fill="currentColor"
        d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8Z"/>
        <path fill="#ff0033"
        d="m9.6 15.4 6.2-3.4-6.2-3.4v6.8Z"/>
    </svg>`;

}
else if(platform==="instagram"){

    name="Instagram";
    icon="◎";
    buttonClass="instagram-btn";

    logo=`
    <svg class="brand-logo" viewBox="0 0 24 24">
        <rect x="3" y="3" width="18" height="18" rx="5"
        fill="none"
        stroke="currentColor"
        stroke-width="2.2"/>
        <circle cx="12" cy="12" r="4.1"
        fill="none"
        stroke="currentColor"
        stroke-width="2.2"/>
        <circle cx="17.5" cy="6.7" r="1.25"
        fill="currentColor"/>
    </svg>`;

}
else{

    name="Facebook";
    icon="f";
    buttonClass="facebook-btn";

    logo=`
    <svg class="brand-logo" viewBox="0 0 24 24">
        <path fill="currentColor"
        d="M13.5 21v-8h2.8l.4-3h-3.2V8.1c0-.9.3-1.5 1.6-1.5h1.8V3.9c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3V10H7.4v3h2.8v8h3.3Z"/>
    </svg>`;

}


document.body.innerHTML=`

<div class="container">

    <div class="card">

        <div class="rocket">
            🚀
        </div>

        <div class="platform">

            <div class="platform-icon ${platform}">
                ${icon}
            </div>

            <span>
                ${name}
            </span>

        </div>

        <h2 id="title">
            Opening ${name}...
        </h2>

        <p class="subtitle" id="subtitle">
            Please wait while we open the account.
        </p>

        <button
            class="retry ${buttonClass}"
            onclick="openApp()"
        >

            ${logo}

            Open in ${name}

        </button>

        <div
            class="failure"
            id="failure"
        >
            Didn't open? Tap the button to try again.
        </div>

    </div>

    <div class="credit">
        Created with ❤️ by <strong>Amit Yadav</strong>
    </div>

</div>

`;


/* Same automatic app-open behavior */
requestAnimationFrame(()=>{
    requestAnimationFrame(openApp);
});


/* Failure message after attempt */
setTimeout(()=>{

    const title=document.getElementById("title");
    const subtitle=document.getElementById("subtitle");
    const failure=document.getElementById("failure");

    if(title){
        title.textContent="Didn't open?";
    }

    if(subtitle){
        subtitle.textContent="Tap the button below to try again.";
    }

    if(failure){
        failure.style.display="block";
    }

},2200);

}

</script>

</body>
</html>
